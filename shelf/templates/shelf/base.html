{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="{% static 'shelf/logo-mark.svg' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'shelf/styles.css' %}" />
    <title>{% block title %}ShareShelf{% endblock %}</title>
  </head>
  <body>
    {% block body %}{% endblock %}
    {% include "shelf/partials/toasts.html" %}
    <script src="{% static 'shelf/app.js' %}" defer></script>
  </body>
</html>
