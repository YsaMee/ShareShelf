{% extends "shelf/auth.html" %}
{% load shelf_tags %}
{% block title %}Password updated · ShareShelf{% endblock %}
{% block panel %}
  <div class="login-heading">
    <p class="eyebrow">All set</p>
    <h2>Your password is updated.</h2>
    <p class="muted">Log in with your new password to get back to your shelf.</p>
  </div>
  <a class="btn btn-primary btn-block" href="{% url 'login' %}">Log in to ShareShelf {% icon "arrow-right" 16 %}</a>
{% endblock %}
