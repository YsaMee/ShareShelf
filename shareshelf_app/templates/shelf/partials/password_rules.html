{% load shelf_tags %}
<ul class="password-rules" aria-label="Password requirements" data-password-rules>
  <li class="rule" data-rule="length">{% icon "circle-check" 12 %} 8+ characters</li>
  <li class="rule" data-rule="mix">{% icon "circle-check" 12 %} Letters &amp; digits</li>
  <li class="rule" data-rule="match">{% icon "circle-check" 12 %} Passwords match</li>
</ul>
