{% load shelf_tags %}
{% comment %}A styled dropdown for a Django ChoiceField. Pass: field, and optionally icon.{% endcomment %}
<span class="input-wrap{% if icon %} has-icon{% endif %}">
  {% if icon %}{% icon icon 16 2 "input-icon" %}{% endif %}
  <select class="input tinted" name="{{ field.html_name }}" id="{{ field.auto_id }}">
    {% for value, label in field.field.choices %}
      <option value="{{ value }}"{% if value == field.value %} selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
  {% icon "chevron-down" 16 2 "input-chevron" %}
</span>
