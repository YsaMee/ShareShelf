{% load shelf_tags %}
{% comment %}A password box with a show/hide button. Pass: name, autocomplete, and role ("new" or "confirm") for the sign-up rules.{% endcomment %}
<span class="input-wrap">
  <input class="input" type="password" name="{{ name }}" placeholder="••••••••" required autocomplete="{{ autocomplete }}"
         data-password{% if role %} data-password-role="{{ role }}"{% endif %} />
  <button type="button" class="input-suffix" data-toggle-password aria-label="Show password" aria-pressed="false">
    <span data-eye>{% icon "eye" 16 %}</span><span data-eye-off hidden>{% icon "eye-off" 16 %}</span>
  </button>
</span>
